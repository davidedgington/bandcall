<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />
  <meta name="theme-color" content="#080808" />
  <title>BandCall</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 35px 22px 80px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .loading {
      color: #888;
      margin-top: 50px;
      font-size: 16px;
    }

    .event {
      font-size: 28px;
      font-weight: 800;
      margin-top: 42px;
    }

    .artist-name {
      color: #b7b7b7;
      font-size: 15px;
      font-weight: 700;
      margin-top: 7px;
    }

    .artist-links {
      display: none;
      margin-top: 18px;
      margin-bottom: 25px;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid #303030;
      border-radius: 999px;
      background: #171717;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .tip-link {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 15px 16px;
      border-radius: 14px;
      background: #ffffff;
      color: #080808;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .subtitle {
      color: #888;
      margin-top: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .live-sync {
      display: inline-block;
      color: #666;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 7px 11px;
      margin-bottom: 25px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    .option {
      width: 100%;
      background: #171717;
      color: white;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 19px;
      margin-bottom: 12px;
      text-align: left;
      cursor: pointer;
    }

    .option.selected {
      border-color: #ffffff;
    }

    .option-title {
      font-size: 16px;
      font-weight: 900;
    }

    .option-description {
      color: #777;
      margin-top: 5px;
      font-size: 13px;
    }

    .form {
      display: none;
      border-top: 1px solid #222;
      margin-top: 28px;
      padding-top: 18px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 14px;
      font-weight: 700;
      margin: 15px 0 9px;
    }

    input,
    textarea {
      width: 100%;
      border: 0;
      outline: none;
      background: #202020;
      color: white;
      border-radius: 13px;
      padding: 16px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    #songList {
      margin-top: 12px;
    }

    .song {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 9px;
      cursor: pointer;
    }

    .song.selected {
      border-color: white;
    }

    .song-title {
      color: white;
      font-size: 16px;
      font-weight: 800;
    }

    .artist {
      color: #777;
      font-size: 14px;
      margin-top: 3px;
    }

    .empty-songs {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px;
      color: #888;
      font-size: 13px;
      line-height: 19px;
    }

    .send {
      width: 100%;
      background: white;
      color: #080808;
      border: 0;
      border-radius: 14px;
      padding: 18px;
      font-size: 15px;
      font-weight: 900;
      margin-top: 22px;
      cursor: pointer;
    }

    .send:disabled {
      opacity: 0.5;
    }

    .error {
      color: #ff8c8c;
      margin-top: 14px;
      line-height: 20px;
    }

    .success {
      display: none;
      text-align: center;
      padding-top: 100px;
    }

    .success-icon {
      font-size: 70px;
      font-weight: 900;
    }

    .success-title {
      font-size: 30px;
      font-weight: 900;
      margin-top: 15px;
    }

    .success-text {
      color: #888;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .not-live {
      display: none;
      background: #171717;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 22px;
      margin-top: 45px;
    }

    .not-live-title {
      font-size: 20px;
      font-weight: 800;
    }

    .not-live-text {
      color: #888;
      margin-top: 7px;
      line-height: 21px;
    }

    .footer {
      color: #444;
      text-align: center;
      font-size: 11px;
      margin-top: 50px;
      line-height: 20px;
    }

    .footer a {
      color: #666;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="logo">BANDCALL</div>

    <div id="loading" class="loading">
      Joining gig...
    </div>

    <div id="main" style="display:none">
      <div id="eventName" class="event"></div>
      <div id="artistName" class="artist-name"></div>

      <div id="artistLinks" class="artist-links">
        <div id="socialLinks" class="social-links"></div>

        <a
          id="tipLink"
          class="tip-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          TIP THE ARTIST
        </a>
      </div>

      <div class="subtitle">
        What would you like to do?
      </div>

      <div class="live-sync">
        LIVE SONG LIST - UPDATES AUTOMATICALLY
      </div>

      <div id="options"></div>

      <div id="form" class="form">
        <label>Your name</label>

        <input
          id="audienceName"
          placeholder="e.g. Dave"
          maxlength="80"
          autocomplete="name"
        />

        <div id="songArea" style="display:none">
          <label>Choose a song</label>

          <input
            id="search"
            placeholder="Search songs or artists..."
            maxlength="100"
          />

          <div id="songList"></div>
        </div>

        <div id="shoutoutArea" style="display:none">
          <label>Your shout-out</label>

          <textarea
            id="message"
            placeholder="Happy birthday Sarah from everyone at table 6!"
            maxlength="500"
          ></textarea>
        </div>

        <div id="error" class="error"></div>

        <button
          id="submitButton"
          class="send"
          onclick="submitRequest()"
        >
          SEND REQUEST
        </button>
      </div>
    </div>

    <div id="notLive" class="not-live">
      <div class="not-live-title">
        Gig not found
      </div>

      <div class="not-live-text">
        This BandCall session isn't currently live.
        Check the QR code and try again.
      </div>
    </div>

    <div id="success" class="success">
      <div class="success-icon">&#10003;</div>

      <div class="success-title">
        REQUEST SENT!
      </div>

      <div class="success-text">
        Your request has been sent to the performer.
      </div>

      <button
        class="send"
        onclick="resetPage()"
      >
        SEND ANOTHER
      </button>
    </div>

    <div class="footer">
      BANDCALL<br />
      <a href="./privacy.html">Privacy</a>
      &nbsp;&middot;&nbsp;
      <a href="./support.html">Support</a>
    </div>
  </div>

<script>
const SUPABASE_URL =
  'https://qfxkdwyssbhnwkboprwi.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_C9S6VHNun6EW0p2LIog2zw_XIgXe3PX';

const headers = {
  apikey: SUPABASE_KEY,
  'Content-Type': 'application/json'
};

const SONG_REFRESH_MS = 5000;
const GIG_REFRESH_EVERY = 3;

let gig = null;
let songs = [];
let profileLinks = null;

let selectedType = null;
let selectedSongId = null;

let refreshTimer = null;
let refreshTick = 0;
let refreshBusy = false;

const params =
  new URLSearchParams(
    window.location.search
  );

const gigCode =
  (params.get('code') || '')
    .trim()
    .toUpperCase();


async function fetchLiveGig() {
  const response =
    await fetch(
      SUPABASE_URL +
        '/rest/v1/gigs' +
        '?code=eq.' +
        encodeURIComponent(gigCode) +
        '&is_live=eq.true' +
        '&select=*',
      {
        headers,
        cache: 'no-store'
      }
    );

  if (!response.ok) {
    throw new Error(
      await response.text()
    );
  }

  const data =
    await response.json();

  return data?.[0] || null;
}


async function fetchAvailableSongs() {
  if (!gig?.profile_id) {
    return [];
  }

  const response =
    await fetch(
      SUPABASE_URL +
        '/rest/v1/songs' +
        '?profile_id=eq.' +
        gig.profile_id +
        '&active=eq.true' +
        '&select=*' +
        '&order=title.asc',
      {
        headers,
        cache: 'no-store'
      }
    );

  if (!response.ok) {
    throw new Error(
      await response.text()
    );
  }

  return await response.json();
}


async function fetchProfileLinks() {
  if (!gig?.id) {
    return null;
  }

  const response =
    await fetch(
      SUPABASE_URL +
        '/rest/v1/rpc/get_live_profile_links',
      {
        method: 'POST',
        headers,
        cache: 'no-store',
        body: JSON.stringify({
          p_gig_id: gig.id
        })
      }
    );

  if (!response.ok) {
    throw new Error(
      await response.text()
    );
  }

  const data =
    await response.json();

  return data?.[0] || null;
}


function safeExternalUrl(value) {
  if (!value) {
    return null;
  }

  try {
    const url =
      new URL(value);

    if (
      url.protocol !== 'http:' &&
      url.protocol !== 'https:'
    ) {
      return null;
    }

    return url.href;
  }
  catch {
    return null;
  }
}


function renderArtistLinks() {
  const artistName =
    document.getElementById(
      'artistName'
    );

  const artistLinks =
    document.getElementById(
      'artistLinks'
    );

  const socialLinks =
    document.getElementById(
      'socialLinks'
    );

  const tipLink =
    document.getElementById(
      'tipLink'
    );

  artistName.textContent =
    profileLinks?.profile_name || '';

  socialLinks.innerHTML =
    '';

  const socialItems = [
    [
      'Instagram',
      profileLinks?.instagram_url
    ],
    [
      'TikTok',
      profileLinks?.tiktok_url
    ],
    [
      'Facebook',
      profileLinks?.facebook_url
    ],
    [
      'Website',
      profileLinks?.website_url
    ]
  ];

  let visibleCount = 0;

  socialItems.forEach(
    ([label, rawUrl]) => {
      const url =
        safeExternalUrl(
          rawUrl
        );

      if (!url) {
        return;
      }

      const link =
        document.createElement(
          'a'
        );

      link.className =
        'social-link';

      link.textContent =
        label;

      link.href =
        url;

      link.target =
        '_blank';

      link.rel =
        'noopener noreferrer';

      socialLinks.appendChild(
        link
      );

      visibleCount += 1;
    }
  );

  const tipUrl =
    safeExternalUrl(
      profileLinks?.tip_url
    );

  if (tipUrl) {
    tipLink.href =
      tipUrl;

    tipLink.style.display =
      'block';

    visibleCount += 1;
  }
  else {
    tipLink.removeAttribute(
      'href'
    );

    tipLink.style.display =
      'none';
  }

  artistLinks.style.display =
    visibleCount > 0
      ? 'block'
      : 'none';
}


function getSongSignature(list) {
  return list
    .map(
      song => song.id
    )
    .join('|');
}


async function loadBandCall() {
  if (!gigCode) {
    showNotLive();
    return;
  }

  try {
    gig =
      await fetchLiveGig();

    if (!gig) {
      showNotLive();
      return;
    }

    const [
      initialSongs,
      initialProfileLinks
    ] =
      await Promise.all([
        fetchAvailableSongs(),
        fetchProfileLinks()
      ]);

    songs =
      initialSongs;

    profileLinks =
      initialProfileLinks;

    document.getElementById(
      'eventName'
    ).textContent =
      gig.event_name;

    renderArtistLinks();
    buildOptions();

    document.getElementById(
      'loading'
    ).style.display =
      'none';

    document.getElementById(
      'notLive'
    ).style.display =
      'none';

    document.getElementById(
      'main'
    ).style.display =
      'block';

    startAutoRefresh();
  }
  catch (error) {
    console.error(
      error
    );

    document.getElementById(
      'loading'
    ).textContent =
      'Could not connect to BandCall.';
  }
}


function startAutoRefresh() {
  stopAutoRefresh();

  refreshTimer =
    setInterval(
      refreshLiveState,
      SONG_REFRESH_MS
    );
}


function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(
      refreshTimer
    );

    refreshTimer =
      null;
  }
}


async function refreshLiveState() {
  if (
    refreshBusy ||
    !gig ||
    document.hidden
  ) {
    return;
  }

  refreshBusy =
    true;

  try {
    refreshTick += 1;

    if (
      refreshTick %
        GIG_REFRESH_EVERY ===
      0
    ) {
      const refreshedGig =
        await fetchLiveGig();

      if (!refreshedGig) {
        showNotLive();
        return;
      }

      const optionsChanged =
        refreshedGig.allow_requests !==
          gig.allow_requests ||
        refreshedGig.allow_singing !==
          gig.allow_singing ||
        refreshedGig.allow_shoutouts !==
          gig.allow_shoutouts;

      gig =
        refreshedGig;

      const refreshedLinks =
        await fetchProfileLinks();

      profileLinks =
        refreshedLinks;

      renderArtistLinks();

      if (optionsChanged) {
        buildOptions();
      }
    }

    const freshSongs =
      await fetchAvailableSongs();

    const oldSignature =
      getSongSignature(
        songs
      );

    const newSignature =
      getSongSignature(
        freshSongs
      );

    if (
      oldSignature ===
      newSignature
    ) {
      return;
    }

    const oldSelectedSongId =
      selectedSongId;

    songs =
      freshSongs;

    if (oldSelectedSongId) {
      const stillAvailable =
        songs.some(
          song =>
            song.id ===
            oldSelectedSongId
        );

      if (!stillAvailable) {
        selectedSongId =
          null;

        if (
          selectedType ===
            'song' ||
          selectedType ===
            'sing'
        ) {
          document.getElementById(
            'error'
          ).textContent =
            'That song has just been played and is no longer available. Please choose another.';
        }
      }
    }

    if (
      selectedType ===
        'song' ||
      selectedType ===
        'sing'
    ) {
      renderSongs(
        document.getElementById(
          'search'
        ).value
      );
    }
  }
  catch (error) {
    console.error(
      'BandCall refresh failed:',
      error
    );
  }
  finally {
    refreshBusy =
      false;
  }
}


document.addEventListener(
  'visibilitychange',
  () => {
    if (
      !document.hidden &&
      gig
    ) {
      refreshLiveState();
    }
  }
);


function buildOptions() {
  const options =
    document.getElementById(
      'options'
    );

  options.innerHTML =
    '';

  if (gig.allow_requests) {
    options.appendChild(
      createOption(
        'song',
        'REQUEST A SONG',
        'Pick something from our song list'
      )
    );
  }

  if (gig.allow_singing) {
    options.appendChild(
      createOption(
        'sing',
        'SING WITH US',
        'Come up and perform with us'
      )
    );
  }

  if (gig.allow_shoutouts) {
    options.appendChild(
      createOption(
        'shoutout',
        'SEND A SHOUT-OUT',
        'Birthday, dedication or message'
      )
    );
  }
}


function createOption(
  type,
  title,
  description
) {
  const button =
    document.createElement(
      'button'
    );

  button.className =
    'option';

  const titleDiv =
    document.createElement(
      'div'
    );

  titleDiv.className =
    'option-title';

  titleDiv.textContent =
    title;

  const descriptionDiv =
    document.createElement(
      'div'
    );

  descriptionDiv.className =
    'option-description';

  descriptionDiv.textContent =
    description;

  button.appendChild(
    titleDiv
  );

  button.appendChild(
    descriptionDiv
  );

  button.onclick =
    () => {
      selectType(
        type,
        button
      );
    };

  return button;
}


function selectType(
  type,
  button
) {
  selectedType =
    type;

  selectedSongId =
    null;

  document.getElementById(
    'error'
  ).textContent =
    '';

  document
    .querySelectorAll(
      '.option'
    )
    .forEach(
      item =>
        item.classList.remove(
          'selected'
        )
    );

  button.classList.add(
    'selected'
  );

  document.getElementById(
    'form'
  ).style.display =
    'block';

  const songArea =
    document.getElementById(
      'songArea'
    );

  const shoutoutArea =
    document.getElementById(
      'shoutoutArea'
    );

  if (
    type === 'song' ||
    type === 'sing'
  ) {
    songArea.style.display =
      'block';

    shoutoutArea.style.display =
      'none';

    renderSongs('');
  }
  else {
    songArea.style.display =
      'none';

    shoutoutArea.style.display =
      'block';
  }

  const submit =
    document.getElementById(
      'submitButton'
    );

  if (type === 'song') {
    submit.textContent =
      'SEND SONG REQUEST';
  }
  else if (
    type === 'sing'
  ) {
    submit.textContent =
      'ASK TO SING';
  }
  else {
    submit.textContent =
      'SEND SHOUT-OUT';
  }
}


document.getElementById(
  'search'
).addEventListener(
  'input',
  function () {
    renderSongs(
      this.value
    );
  }
);


function renderSongs(
  searchText
) {
  const holder =
    document.getElementById(
      'songList'
    );

  holder.innerHTML =
    '';

  const search =
    searchText
      .toLowerCase()
      .trim();

  const filtered =
    songs.filter(
      song => {
        const title =
          (
            song.title ||
            ''
          ).toLowerCase();

        const artist =
          (
            song.artist ||
            ''
          ).toLowerCase();

        return (
          title.includes(
            search
          ) ||
          artist.includes(
            search
          )
        );
      }
    );

  if (
    filtered.length ===
    0
  ) {
    const empty =
      document.createElement(
        'div'
      );

    empty.className =
      'empty-songs';

    if (
      songs.length ===
      0
    ) {
      empty.textContent =
        'There are no more available songs in this BandCall session.';
    }
    else {
      empty.textContent =
        'No songs match your search.';
    }

    holder.appendChild(
      empty
    );

    return;
  }

  filtered.forEach(
    song => {
      const card =
        document.createElement(
          'div'
        );

      card.className =
        'song';

      if (
        selectedSongId ===
        song.id
      ) {
        card.classList.add(
          'selected'
        );
      }

      const title =
        document.createElement(
          'div'
        );

      title.className =
        'song-title';

      title.textContent =
        song.title;

      const artist =
        document.createElement(
          'div'
        );

      artist.className =
        'artist';

      artist.textContent =
        song.artist || '';

      card.appendChild(
        title
      );

      card.appendChild(
        artist
      );

      card.onclick =
        () => {
          selectedSongId =
            song.id;

          document.getElementById(
            'error'
          ).textContent =
            '';

          renderSongs(
            document.getElementById(
              'search'
            ).value
          );
        };

      holder.appendChild(
        card
      );
    }
  );
}


async function submitRequest() {
  const error =
    document.getElementById(
      'error'
    );

  error.textContent =
    '';

  const name =
    document.getElementById(
      'audienceName'
    )
      .value
      .trim();

  if (!selectedType) {
    error.textContent =
      'Choose an option first.';

    return;
  }

  if (!name) {
    error.textContent =
      'Please enter your name.';

    return;
  }

  if (
    (
      selectedType ===
        'song' ||
      selectedType ===
        'sing'
    ) &&
    !selectedSongId
  ) {
    error.textContent =
      'Please choose a song.';

    return;
  }

  const message =
    document.getElementById(
      'message'
    )
      .value
      .trim();

  if (
    selectedType ===
      'shoutout' &&
    !message
  ) {
    error.textContent =
      'Please enter your message.';

    return;
  }

  const button =
    document.getElementById(
      'submitButton'
    );

  button.disabled =
    true;

  button.textContent =
    'SENDING...';

  const submittingSongId =
    selectedSongId;

  try {
    const response =
      await fetch(
        SUPABASE_URL +
          '/rest/v1/requests',
        {
          method: 'POST',
          headers: {
            ...headers,
            Prefer:
              'return=minimal'
          },
          body:
            JSON.stringify({
              gig_id:
                gig.id,
              song_id:
                (
                  selectedType ===
                    'song' ||
                  selectedType ===
                    'sing'
                )
                  ? selectedSongId
                  : null,
              request_type:
                selectedType,
              audience_name:
                name,
              message:
                selectedType ===
                  'shoutout'
                  ? message
                  : null,
              status:
                'new'
            })
        }
      );

    if (!response.ok) {
      const responseText =
        await response.text();

      if (submittingSongId) {
        const freshSongs =
          await fetchAvailableSongs();

        songs =
          freshSongs;

        const stillAvailable =
          songs.some(
            song =>
              song.id ===
              submittingSongId
          );

        if (!stillAvailable) {
          selectedSongId =
            null;

          renderSongs(
            document.getElementById(
              'search'
            ).value
          );

          throw new Error(
            'SONG_NO_LONGER_AVAILABLE'
          );
        }
      }

      if (
        responseText
          .toLowerCase()
          .includes(
            'wait a moment'
          )
      ) {
        throw new Error(
          'REQUEST_COOLDOWN'
        );
      }

      throw new Error(
        responseText
      );
    }

    document.getElementById(
      'main'
    ).style.display =
      'none';

    document.getElementById(
      'success'
    ).style.display =
      'block';
  }
  catch (err) {
    console.error(
      err
    );

    if (
      err.message ===
      'SONG_NO_LONGER_AVAILABLE'
    ) {
      error.textContent =
        'That song has just been played and is no longer available. Please choose another.';
    }
    else if (
      err.message ===
      'REQUEST_COOLDOWN'
    ) {
      error.textContent =
        'Please wait a moment before sending another request.';
    }
    else {
      error.textContent =
        'Could not send your request. Please try again.';
    }

    button.disabled =
      false;

    if (
      selectedType ===
      'song'
    ) {
      button.textContent =
        'SEND SONG REQUEST';
    }
    else if (
      selectedType ===
      'sing'
    ) {
      button.textContent =
        'ASK TO SING';
    }
    else {
      button.textContent =
        'SEND SHOUT-OUT';
    }
  }
}


function resetPage() {
  selectedType =
    null;

  selectedSongId =
    null;

  document.getElementById(
    'audienceName'
  ).value =
    '';

  document.getElementById(
    'message'
  ).value =
    '';

  document.getElementById(
    'search'
  ).value =
    '';

  document.getElementById(
    'error'
  ).textContent =
    '';

  document.getElementById(
    'form'
  ).style.display =
    'none';

  document.getElementById(
    'success'
  ).style.display =
    'none';

  document.getElementById(
    'main'
  ).style.display =
    'block';

  document
    .querySelectorAll(
      '.option'
    )
    .forEach(
      item =>
        item.classList.remove(
          'selected'
        )
    );

  const submit =
    document.getElementById(
      'submitButton'
    );

  submit.disabled =
    false;

  submit.textContent =
    'SEND REQUEST';

  refreshLiveState();
}


function showNotLive() {
  stopAutoRefresh();

  gig =
    null;

  document.getElementById(
    'loading'
  ).style.display =
    'none';

  document.getElementById(
    'main'
  ).style.display =
    'none';

  document.getElementById(
    'success'
  ).style.display =
    'none';

  document.getElementById(
    'notLive'
  ).style.display =
    'block';
}


window.addEventListener(
  'beforeunload',
  stopAutoRefresh
);


loadBandCall();
</script>
